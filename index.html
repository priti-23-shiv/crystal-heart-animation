
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Heart ✨</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center,
      #24102e 0%, #100b20 45%, #03040d 100%);
  font-family: Georgia, serif;
  color: white;
}

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1000px;
}

.heart-container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 25px #f66bd888);
}

.heart {
  position: relative;
  width: 150px;
  height: 150px;
  cursor: pointer;
  transform: rotate(-45deg);
  background: linear-gradient(
    135deg,
    #fff5ff 0%,
    #f7a8f7 18%,
    #b76cff 38%,
    #5edbff 58%,
    #f7a8f7 78%,
    #ffffff 100%
  );
  background-size: 250% 250%;
  animation: crystalShine 5s ease-in-out infinite,
             heartbeat 2.4s ease-in-out infinite;
  box-shadow:
    inset 8px 8px 18px #ffffffa8,
    inset -8px -8px 20px #5525bbaa,
    0 0 20px #e879ff99,
    0 0 55px #b967ff66;
  transition: filter 0.4s ease;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: inherit;
}

.heart::before {
  top: -75px;
  left: 0;
}

.heart::after {
  top: 0;
  left: 75px;
}

/* Crystal facets */
.facet {
  position: absolute;
  z-index: 2;
  width: 0;
  height: 0;
  pointer-events: none;
  opacity: 0.7;
}

.facet.one {
  top: 15px;
  left: 17px;
  border-left: 26px solid transparent;
  border-right: 26px solid transparent;
  border-top: 52px solid #ffffff80;
  transform: rotate(35deg);
}

.facet.two {
  top: 62px;
  left: 42px;
  border-left: 20px solid transparent;
  border-right: 30px solid transparent;
  border-bottom: 42px solid #ffecff70;
  transform: rotate(15deg);
}

.facet.three {
  top: 17px;
  left: 85px;
  border-left: 24px solid transparent;
  border-right: 18px solid transparent;
  border-top: 48px solid #8beaff99;
  transform: rotate(-30deg);
}

.heart-container::before {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #d96dff35 0%,
    #8d4bff12 40%,
    transparent 70%
  );
  filter: blur(12px);
  animation: aura 3s ease-in-out infinite alternate;
}

.message {
  position: absolute;
  top: calc(50% + 155px);
  width: 90%;
  text-align: center;
  letter-spacing: 3px;
  font-size: 14px;
  color: #f5c9ff;
  text-shadow: 0 0 15px #e79aff;
  animation: textGlow 3s ease-in-out infinite alternate;
}

.subtitle {
  position: absolute;
  top: calc(50% + 185px);
  width: 90%;
  text-align: center;
  font-size: 12px;
  color: #c8bbdf;
  letter-spacing: 1.5px;
}

.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 8px 2px #eab4ff;
  animation: twinkle var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
}

.scene::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 1px;
  top: calc(50% + 125px);
  background: linear-gradient(
    90deg, transparent, #e4a4ff66, transparent
  );
}

.heart-container.clicked .heart {
  animation: burst 0.7s ease;
  filter: brightness(1.5);
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotateY(-8deg); }
  50% { transform: translateY(-13px) rotateY(8deg); }
}

@keyframes heartbeat {
  0%, 100% { scale: 1; }
  50% { scale: 1.035; }
}

@keyframes crystalShine {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes aura {
  from { transform: scale(.85); opacity: .6; }
  to { transform: scale(1.15); opacity: 1; }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(.5); }
  50% { opacity: 1; transform: scale(1.6); }
}

@keyframes textGlow {
  from { opacity: .65; }
  to { opacity: 1; }
}

@keyframes burst {
  0% { transform: rotate(-45deg) scale(1); }
  50% { transform: rotate(-45deg) scale(1.22); }
  100% { transform: rotate(-45deg) scale(1); }
}

@media (max-width: 480px) {
  .heart {
    width: 110px;
    height: 110px;
  }

  .heart::before,
  .heart::after {
    width: 110px;
    height: 110px;
  }

  .heart::before { top: -55px; }
  .heart::after { left: 55px; }

  .facet.one {
    top: 10px;
    left: 10px;
    border-left-width: 18px;
    border-right-width: 18px;
    border-top-width: 38px;
  }

  .facet.two {
    top: 45px;
    left: 30px;
    border-left-width: 14px;
    border-right-width: 22px;
    border-bottom-width: 30px;
  }

  .facet.three {
    top: 10px;
    left: 63px;
    border-left-width: 17px;
    border-right-width: 13px;
    border-top-width: 35px;
  }

  .message { font-size: 12px; letter-spacing: 2px; }
  .subtitle { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 10s !important;
  }
}
</style>
</head>

<body>
<div class="scene" id="scene">

  <div class="heart-container" id="heartContainer">
    <div class="heart" id="heart" aria-label="Crystal heart" role="button" tabindex="0">
      <span class="facet one"></span>
      <span class="facet two"></span>
      <span class="facet three"></span>
    </div>
  </div>

  <div class="message">A LITTLE PIECE OF MAGIC</div>
  <div class="subtitle">Some things shine without a reason ✧</div>

</div>

<script>
const scene = document.getElementById("scene");
const heart = document.getElementById("heart");
const container = document.getElementById("heartContainer");

// Create floating stars
for (let i = 0; i < 65; i++) {
  const star = document.createElement("span");
  star.className = "sparkle";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.setProperty(
    "--duration", (1.5 + Math.random() * 3) + "s"
  );
  star.style.setProperty(
    "--delay", (-Math.random() * 4) + "s"
  );

  scene.appendChild(star);
}

// Tap the crystal heart
function sparkleHeart() {
  container.classList.remove("clicked");
  void container.offsetWidth;
  container.classList.add("clicked");

  setTimeout(() => {
    container.classList.remove("clicked");
  }, 700);

  // A little burst of new sparkles
  for (let i = 0; i < 12; i++) {
    const star = document.createElement("span");
    star.className = "sparkle";

    const rect = heart.getBoundingClientRect();
    star.style.left = rect.left + rect.width / 2 + "px";
    star.style.top = rect.top + rect.height / 2 + "px";
    star.style.setProperty("--duration", "1s");
    star.style.setProperty("--delay", "0s");

    scene.appendChild(star);

    const angle = Math.random() * Math.PI * 2;
    const distance = 50 + Math.random() * 100;

    star.animate([
      { transform: "translate(0, 0) scale(1)", opacity: 1 },
      {
        transform: `translate(
          ${Math.cos(angle) * distance}px,
          ${Math.sin(angle) * distance}px
        ) scale(0)`,
        opacity: 0
      }
    ], { duration: 900, easing: "ease-out" });

    setTimeout(() => star.remove(), 950);
  }
}

heart.addEventListener("click", sparkleHeart);

heart.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    sparkleHeart();
  }
});
</script>
</body>
  </html>
